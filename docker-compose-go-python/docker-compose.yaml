version: '3'
services:
  service1:
    build:
      context: ./service1
      dockerfile: Dockerfile
    deploy:
      replicas: 3
    networks:
      - nginx_lb

  service2:
    build:
      context: ./service2
      dockerfile: Dockerfile
    networks:
      - nginx_lb

  nginx:
    build: ./nginx
    ports:
      - 8198:80
    networks:
      - nginx_lb
    depends_on:
      - service1


networks:
  nginx_lb:
    driver: bridge