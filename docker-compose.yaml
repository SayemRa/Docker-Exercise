version: '3.8'
services:
  nginx:
    image: nginx:latest
    container_name: nginx_gateway
    ports:
      - "8098:8098"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - service1
      - service2
    networks:
      - app_network
    restart: always

  service1:
    build: ./service1
    ports:
      - "8197:8197"
    networks:
      - app_network
    depends_on:
      - service2
    restart: always

  service2:
    build: ./service2
    ports:
      - "8199:8199"
    networks:
      - app_network
    restart: always

networks:
  app_network:
    driver: bridge
