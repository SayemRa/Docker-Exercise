events {}

http {
    upstream service1 {
        server service1:8197;
    }

    upstream service2 {
        server service2:8199;
    }

    server {
        listen 8098;

        location /state {
            proxy_pass http://service1/state;
        }

        location /request {
            proxy_pass http://service1/request;
        }

        location /run-log {
            proxy_pass http://service1/run-log;
        }

        location /monitor {
            proxy_pass http://service1/monitor;
        }

        location /info {
            proxy_pass http://service2/info;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
