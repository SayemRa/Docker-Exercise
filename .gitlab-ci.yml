image: docker:latest

services:
  - docker:dind

variables:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  DOCKER_PRIVILEGED_MODE: "true"

stages:
  - lint
  - build
  - test
  - deploy

before_script:
  - apk add --no-cache docker-cli python3 py3-pip curl
  - python3 -m venv venv
  - source venv/bin/activate
  - pip install pylint flask requests

lint:
  tags:
    - docker
  stage: lint
  script:
    - source venv/bin/activate
    - pylint service1/app.py --fail-under=5

build:
  stage: build
  script:
    - docker-compose build

test:
  stage: test
  script:
    - docker-compose up -d
    - echo "Waiting for Service1 to be ready..."
    - until curl -sSf http://localhost:8197/state; do sleep 5; done
    - docker-compose exec service1 python -m unittest discover -s tests
    - docker-compose down

deploy:
  stage: deploy
  only:
    - main
  script:
    - docker-compose up -d
