image: docker:latest

services:
  - name: docker:dind
    command:
      - "--host=tcp://0.0.0.0:2375"
      - "--tls=false"

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  DOCKER_PRIVILEGED_MODE: "true"

before_script:
  - apk add --no-cache python3 py3-pip iptables
  - python3 -m venv venv
  - source venv/bin/activate
  - pip install pylint flask requests

stages:
  - lint
  - build
  - test

lint:
  stage: lint
  script:
    - pip install autopep8 pylint
    - pip install -r requirements-test.txt
    - autopep8 --in-place --aggressive --aggressive service1/.py tests/.py
    - pylint service1/.py tests/.py --disable=R,C --fail-under=6.0

build:
  stage: build
  script:
    - docker-compose build

test:
  stage: test
  script:
    - docker-compose up -d
    - timeout 30 sh -c "until docker info; do sleep 1; done"
    - python -m unittest discover -s tests
    - docker-compose down