image: docker:latest

services:
  - docker:dind

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  DOCKER_PRIVILEGED_MODE: "true"

before_script:
  - apk add --no-cache docker-cli python3 py3-pip
  - pip install pylint

stages:
  - lint
  - build
  - test
  - deploy

lint:
  stage: lint
  script:
    - pylint service1/app.py --fail-under=7

build:
  stage: build
  script:
    - docker-compose build

test:
  stage: test
  script:
    - docker-compose up -d
    - python -m unittest discover -s tests
    - docker-compose down

deploy:
  stage: deploy
  script:
    - docker-compose up -d
