image: docker:latest

services:
  - name: docker:dind
    command: ["--tls=false", "--host=tcp://0.0.0.0:2375"]
    privileged: true

variables:
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: "overlay2"
  DOCKER_BUILDKIT: "1"
  COMPOSE_DOCKER_CLI_BUILD: "1"

before_script:
  - apk add --no-cache python3 py3-pip iptables
  - python3 -m venv venv
  - source venv/bin/activate
  - pip install pylint flask requests autopep8

stages:
  - lint
  - build
  - test

lint:
  stage: lint
  script:
    - autopep8 --in-place --aggressive --aggressive service1/*.py tests/*.py || true
    - pylint service1/*.py tests/*.py --disable=R,C --fail-under=6.0 || true

build:
  stage: build
  script:
    - sleep 20 
    - docker info  
    - docker-compose build || true

test:
  stage: test
  script:
    - docker-compose up -d
    - sleep 10  # Give services time to start
    - python -m unittest discover -s tests || true
    - docker-compose down
