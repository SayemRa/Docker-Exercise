image: docker:20.10.24

services:
  - name: docker:20.10.24-dind
    command: ["--host=tcp://0.0.0.0:2375", "--host=unix:///var/run/docker.sock"]

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

before_script:
  - apk add --no-cache docker-cli python3 py3-pip curl
  - python3 -m venv venv
  - source venv/bin/activate
  - pip install pylint flask requests

stages:
  - lint
  - build
  - test

lint:
  stage: lint
  script:
    - source venv/bin/activate
    - pylint service1/app.py --fail-under=5

build:
  stage: build
  script:
    - docker-compose build

test:
  stage: test
  script:
    - docker-compose up -d
    - python -m unittest discover -s tests
    - docker-compose down

