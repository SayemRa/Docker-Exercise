image: docker:latest

stages:
  - build
  - test
  - deploy

build:
  stage: build
  tags:
    - docker
  script:
    - docker-compose build

test:
  stage: test
  tags:
    - docker
  script:
    - docker-compose up -d
    - python -m unittest discover -s tests
    - docker-compose down

deploy:
  stage: deploy
  tags:
    - docker
  script:
    - docker-compose up -d
