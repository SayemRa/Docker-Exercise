image: docker:latest

services:
  - docker:dind

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

stages:
  - lint
  - build
  - test
  - deploy

lint:
  stage: lint
  script:
    - pip install pylint
    - pylint service1/app.py --fail-under=7  # Ensures good code quality
    - golangci-lint run ./service2  # Run static analysis for Go

build:
  stage: build
  script:
    - docker-compose build

test:
  stage: test
  script:
    - docker-compose up -d
    - python -m unittest discover -s tests
    - docker-compose down

deploy:
  stage: deploy
  only:
    - main  # Ensures deployment happens only on the main branch
  script:
    - ssh -o StrictHostKeyChecking=no user@your-server-ip "cd /project && git pull && docker-compose up -d"
